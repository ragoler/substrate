# Custom Compute Class for the hotel's rooms (the WorkerPool's worker pods).
# Opt-in: applied by setup_infra.sh when USE_COMPUTE_CLASS=TRUE, and selected
# by the WorkerPool via nodeSelector cloud.google.com/compute-class:
# hotel-rooms (see infra/workerpool.yaml). With Node Auto-Provisioning
# enabled, GKE then creates right-sized node pools for the rooms on demand —
# and "+ Room" in the UI becomes a two-layer story: Substrate scales the
# WorkerPool, and NAP grows the cluster underneath it when needed.
#
# Deliberately ON-DEMAND (spot: false): rooms are long-lived warm pods, and a
# Spot preemption would kill an AWAKE guest's un-checkpointed RAM — breaking
# the demo's memory-survival proof. (Sleeping guests would be fine; flip the
# priorities to spot: true if you want to demo that failure mode cheaply.)
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: hotel-rooms
spec:
  # ONE machine type, on purpose. A gVisor memory snapshot records the CPU
  # feature set it was taken on, and Substrate restores it in full only on a
  # worker whose CPU features are a superset — otherwise it falls back to a
  # ROOTFS restore (files survive, memory does not). Keeping every room, and
  # the node the golden snapshot is built on, on the same CPU platform keeps
  # the memory story intact. Families that mix platforms (e2, n2, n2d) are a
  # lottery; c3 is Sapphire Rapids only (upstream setup-gcp's default too).
  # 4 vCPUs because a restore is CPU-bound and several rooms wake at once when
  # the hotel is busy.
  priorities:
    - machineType: c3-standard-4
  # Let GKE create node pools for this class on demand (requires NAP).
  nodePoolAutoCreation:
    enabled: true
  # Never fall back to another machine type (see above). Wait for c3 instead.
  whenUnsatisfiable: DoNotScaleUp
  activeMigration:
    optimizeRulePriority: true
