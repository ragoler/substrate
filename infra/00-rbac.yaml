# RBAC for the concierge. Named 00- so it sorts (and applies) before the
# workload manifests.
#
# Everything Substrate-side (actors, templates, egress policies) goes through
# the ate API, authenticated with this ServiceAccount's projected token and
# authorized by Substrate's own access policies (deploy_app.sh grants it
# `editor` on the hotel atespace and `viewer` globally). Kubernetes RBAC is
# needed for just two things:
#   1. read its OWN pod — to learn its image digest (containerStatuses[].imageID)
#      so it can register a digest-pinned ActorTemplate;
#   2. patch the WorkerPool — "add room" / "remove room" scales it at runtime.
# The TLS trust anchors and the router client certificate are projected by
# kubelet (clusterTrustBundle / podCertificate volumes) — no Secret reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-hotel-concierge
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: substrate-hotel-concierge
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["ate.dev"]
    resources: ["workerpools"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-hotel-concierge
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: substrate-hotel-concierge
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: substrate-hotel-concierge
  apiGroup: rbac.authorization.k8s.io
