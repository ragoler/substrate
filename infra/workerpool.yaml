# The hotel's rooms: a pool of ${WORKER_REPLICAS} workers that the guests
# overcommit onto. Suspended guests hold no room, so the pool serves far more
# persistent agents than it has pods. The concierge can rescale this at
# runtime (UI "add/remove room" -> PATCH spec.replicas).
#
# The ate-controller reconciles this into a Deployment named
# "<workerpool>-deployment" (substrate-hotel-deployment) — distinct from the
# concierge's substrate-hotel-concierge-deployment.
#
# The `workload: substrate-hotel` label is what the ActorTemplate's
# workerSelector (and the concierge's CreateActor calls) bind to.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: substrate-hotel
  namespace: ${NAMESPACE}
  labels:
    workload: substrate-hotel
spec:
  replicas: ${WORKER_REPLICAS}
  # Scheduling for the worker pods. With USE_COMPUTE_CLASS=TRUE this renders
  # to {"cloud.google.com/compute-class": "hotel-rooms"} so the rooms land on
  # nodes auto-provisioned by cluster/compute-class.yaml; otherwise it renders
  # to {} (any node in the default pool).
  template:
    nodeSelector: ${WORKER_NODE_SELECTOR}
  # gVisor (runsc) sandbox class — the default; atelet fetches runsc itself,
  # no node-level --enable-sandbox needed.
  sandboxClass: gvisor
  # Built and pushed by cluster/install-substrate-hotel-prereq.sh via `ko`.
  ateomImage: ${REGION}-docker.pkg.dev/${PROJECT_NAME}/${ARTIFACT_REGISTRY_REPO}/ateom-gvisor:latest
