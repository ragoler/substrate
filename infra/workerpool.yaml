# The hotel's rooms: a pool of ${WORKER_REPLICAS} workers that the guests
# overcommit onto. Sleeping guests hold no room, so the pool serves far more
# persistent agents than it has pods. The concierge can rescale this at
# runtime (UI "add/remove room" -> PATCH spec.replicas).
#
# The ate-controller reconciles this into a Deployment of the same name
# (substrate-hotel) — distinct from substrate-hotel-concierge-deployment.
#
# The `workload: substrate-hotel` label is what the ActorTemplate's
# workerSelector (and the concierge's CreateActor calls) bind to.
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: substrate-hotel
  namespace: ${NAMESPACE}
  labels:
    workload: substrate-hotel
spec:
  replicas: ${WORKER_REPLICAS}
  # gVisor rooms. The runtime binaries come from the cluster-scoped
  # SandboxConfig `gvisor-default` the installer ships (class default).
  sandboxClasses:
    - name: gvisor
  # Upstream's release image, pinned by digest (deploy_app.sh resolves it
  # from ghcr.io for the pinned release in lib.sh).
  workerImage: ${ATEWORKER_IMAGE}
  template:
    # Scheduling for the worker pods. With USE_COMPUTE_CLASS=TRUE this renders
    # to {"cloud.google.com/compute-class": "hotel-rooms"} so the rooms land on
    # nodes auto-provisioned by cluster/compute-class.yaml; otherwise {}.
    nodeSelector: ${WORKER_NODE_SELECTOR}
    # Per-room resources. The LIMITS are the room's advertised capacity — a
    # shared budget Substrate places actors into. Sized to ONE guest
    # (template_manager.py: 1000 millicores / 512 MiB, plus the worker's own
    # reserve), so a room hosts exactly one guest and the oversubscription
    # story reads straight off the floor plan. Raise them to let a room host
    # several guests. The REQUESTS are what the kube-scheduler and NAP pack
    # nodes by.
    resources:
      requests:
        cpu: 750m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
