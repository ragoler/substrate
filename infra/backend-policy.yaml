# Waking a sleeping guest means restoring a checkpoint from GCS — tens of
# seconds. The ALB's default 30 s backend timeout would cut those requests
# off mid-wake, so stretch it. (The concierge's own router timeout is 120 s.)
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: substrate-hotel-concierge-timeout
  namespace: ${NAMESPACE}
spec:
  default:
    timeoutSec: 180
    # Log every LB request to Cloud Logging — statusDetails there says WHY a
    # request failed at the LB (e.g. failed_to_pick_backend vs backend 5xx),
    # which is the only way to diagnose "no healthy upstream" reports.
    logging:
      enabled: true
      sampleRate: 1000000  # parts-per-million == 100%
  targetRef:
    group: ""
    kind: Service
    name: substrate-hotel-concierge
