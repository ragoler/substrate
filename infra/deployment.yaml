# The concierge — the only Deployment this demo ships. (The 3 worker pods
# come from the WorkerPool CR, reconciled by the ate-controller.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-hotel-concierge-deployment
  namespace: ${NAMESPACE}
  labels:
    app: substrate-hotel-concierge
spec:
  # Two replicas on different nodes: the public LB occasionally hits
  # connection-level resets on one endpoint (scanner traffic churning the
  # shared connection pool, node-level blips) — with a second endpoint GCLB
  # retries there and visitors never see it. Guest yield-gating stays correct
  # across replicas because the GUEST itself refuses to yield mid-request
  # (agent-side in-flight guard); the concierge dicts (activity/waking) are
  # per-pod best-effort and converge via Substrate, the source of truth.
  replicas: 2
  selector:
    matchLabels:
      app: substrate-hotel-concierge
  template:
    metadata:
      labels:
        app: substrate-hotel-concierge
    spec:
      serviceAccountName: substrate-hotel-concierge
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: substrate-hotel-concierge
                topologyKey: kubernetes.io/hostname
      # The GCLB data plane lags ~1-2 min detaching a killed endpoint from the
      # NEG; without this drain the site serves "no healthy upstream" after
      # every rollout of this single-replica deployment.
      terminationGracePeriodSeconds: 75
      containers:
        - name: concierge
          image: ${SUBSTRATE_HOTEL_IMAGE}
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "60"]
          ports:
            - containerPort: 8000
          # HOTEL_USERNAME / HOTEL_PASSWORD for HTTP Basic auth. The Secret is
          # created by deploy_app.sh from .env (never rendered into manifests);
          # optional: with no Secret the hotel simply runs unauthenticated.
          # GEMINI_API_KEY: the same Secret the egress gateway injects for the
          # guests, here only for the /llm proxy fallback (LLM_MODE=proxy).
          envFrom:
            - secretRef:
                name: substrate-hotel-auth
                optional: true
            - secretRef:
                name: substrate-hotel-gemini
                optional: true
          env:
            - name: ATE_MODE
              value: "real"
            # Hotel sizing (more guests can be admitted / rooms rescaled at
            # runtime; these are just the starting values).
            - name: GUEST_COUNT
              value: "${GUEST_COUNT}"
            - name: WORKER_REPLICAS
              value: "${WORKER_REPLICAS}"
            # Seconds a guest lingers awake after its last reply. The
            # concierge both gates /internal/yield with it AND bakes it into
            # the guest ActorTemplate env (template_manager.py) — it must
            # reach this pod or .env's LINGER_SECONDS silently does nothing.
            - name: LINGER_SECONDS
              value: "${LINGER_SECONDS}"
            # Downward API — the concierge reads its own pod to learn its
            # image digest (see app/template_manager.py).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The guests' Gemini key reaches them by egress credential
            # injection: this is the ate-secret:// URI the concierge writes
            # into every guest's EgressPolicy (empty = canned replies).
            - name: GEMINI_SECRET_URI
              value: "${GEMINI_SECRET_URI}"
            - name: GEMINI_MODEL
              value: "${GEMINI_MODEL}"
          volumeMounts:
            # Bearer token for ate-api-server: its authentication config
            # (ConfigMap ate-system/ate-api-authentication, written by the
            # upstream installer) accepts any cluster-issuer SA token with
            # this audience. Kubelet rotates it.
            - name: ate-api-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            # Substrate's PKI, projected by kubelet (no Secrets, no shims):
            #   servicedns-ca.pem     — trust anchor for ate-api-server and
            #                           atenet-router serving certs
            #   credential-bundle.pem — this pod's PodCertificate, the
            #                           client cert the router demands
            #                           (SPIFFE ID ns/<ns>/sa/<this SA>, which
            #                           the installer allowlists)
            - name: ate-client
              mountPath: /run/ate-client
              readOnly: true
          # timeoutSeconds: the default is 1s — a briefly busy event loop
          # then fails 3 probes in a row, the pod goes NotReady, the NEG
          # detaches its ONLY endpoint, and the site shows "no healthy
          # upstream". Readiness is deliberately hard to lose.
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: ate-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: ate-api-token
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
        - name: ate-client
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: servicedns-ca.pem
